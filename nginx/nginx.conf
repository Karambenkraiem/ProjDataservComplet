worker_processes auto;

events {
    worker_connections 1024;
}

http {

    upstream backend {
        server backend:3001;
    }

    upstream frontend {
        server frontend:3000;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name alkaramsoft.ovh www.alkaramsoft.ovh;

        location / {
            return 301 https://alkaramsoft.ovh$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name alkaramsoft.ovh www.alkaramsoft.ovh;

        ssl_certificate     /etc/letsencrypt/live/alkaramsoft.ovh/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alkaramsoft.ovh/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        client_max_body_size 50M;

        # ── API + Uploads (backend) ───────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /uploads/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Frontend (Next.js) ────────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
